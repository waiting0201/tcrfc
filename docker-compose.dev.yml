# docker-compose.dev.yml — 本機開發用 override
#
# 用法：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 對正式版（docker-compose.yml）做兩件事：
#   1. 本機不接 Azure SQL，改連**宿主機上既有的 `sqlserver` 容器**（見下方大段說明）。
#   2. 本機不需要 TLS——proxy 改掛 deploy/Caddyfile.dev（http:// 明文，auto_https off）。
#
# ⚠️ Apple Silicon（arm64）上這個 SQL Server 映像檔只有 amd64，跑起來是透過模擬層——這句話現在
# 只跟宿主機上的 `sqlserver` 容器有關（不是本檔管理的服務），冷啟動可能要 30 秒以上。
#
# 🔴🔴 2026-09-21：本機開發資料庫已合併進既有的 `sqlserver` 容器，`mssql-dev` 服務正式退場 🔴🔴
#
# 舊版本檔曾在這裡另開一個 `mssql-dev` 服務（獨立埠 14330、具名 volume `mssql_dev_data`），
# 理由是「不確定能不能安全共用既有的 `sqlserver` 容器」。**使用者已明確拍板改用既有容器**
# （見 docs/17-deployment.md §6「本機開發資料庫」、deploy/README.md）：
#   - 既有 `sqlserver` 容器（`mcr.microsoft.com/mssql/server:2022-latest`，與舊 `mssql-dev`
#     完全同映像檔）monopolize 宿主機 1433 port，供**使用者另一個專案**使用，裡面已有約 25 個
#     資料庫。**不是本 compose 管理，不會出現在本檔或 `docker compose ps` 裡。**
#   - 本專案現在只是**在這個既有 instance 裡新增兩個資料庫**（`tcrfc_club_dev`、
#     `tcrfc_charity_dev`），不再另開第二個 SQL Server 容器。
#   - ⛔ **這個容器沒有掛任何 volume**（資料在容器可寫層）。`docker rm sqlserver` 會讓
#     `tcrfc_club_dev`／`tcrfc_charity_dev` 連同使用者另一個專案的全部資料庫一起消失。
#     TCRFC 這兩個庫的復原方式是重跑 `deploy/local-ddl.sh --apply` ＋ `db/seed/apply-seed.sh`
#     （見 deploy/README.md「`mssql_dev_data` 退場後的回收與復原」）；**別的專案的資料庫沒有
#     這條復原路徑，這不是本專案能承擔的風險，只能記錄、不能替使用者決定要不要動這個容器。**
#   - **風險性質也跟著變了**：以前怕的是「接到錯的容器」（靠寫死拒絕 `sqlserver` 這個名字防呆），
#     現在兩個專案的資料庫住在同一個 instance 裡，怕的是「操作到錯的資料庫」。因此
#     `deploy/local-ddl.sh`／`db/seed/apply-seed.sh` 的防呆改成：**目標容器可由環境變數指定
#     （預設 `sqlserver`），但目標資料庫名稱寫死只允許 `tcrfc_club_dev`／`tcrfc_charity_dev`
#     兩個，其他名稱一律拒絕執行**；建庫一律 `IF NOT EXISTS`，任何情況下都不對 `master` 以外的
#     既有資料庫下 `DROP`／`ALTER`。
#   - **連線方式也跟著變了**：`sqlserver` 不是 compose 服務，`api` 容器連不到「服務名稱」，
#     改連宿主機的 `host.docker.internal`（見下方 `api` 服務的 `extra_hosts`）。
#   - `mssql_dev_data` 這個具名 volume 仍留在 Docker 裡（本檔不再宣告它，但沒有主動刪除，
#     裡面是舊版 `mssql-dev` 的資料）——是否清掉由使用者決定，回收指令見 deploy/README.md。

name: tcrfc

services:
  # ── proxy：本機不需要 TLS，改用明文 HTTP、改本機慣用網域 ─────────────────
  proxy:
    # ⚠️ compose 疊加多個檔案時，list 型欄位（如 ports）預設是「串接」不是「取代」——
    # 沒有 !override，這裡會變成同時發布 80／443／8080 三組，8080 只是多開一個，
    # 443 依然在（且沒有對應的 TLS 憑證，容器可能因此啟動失敗或監聽卻無法完成 TLS 交握）。
    # 用 !override 明確蓋掉正式版的 80/443，只留本機用的 8080（已實測確認語法有效）。
    ports: !override
      - "127.0.0.1:8080:80" # 正式版是 80/443；本機改成不需要 root/sudo 綁定的高位 port，且不開 443
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_EMAIL: dev@example.invalid # dev 版不簽 TLS，此值不會被用到，留著只為滿足變數必填
      TCRFC_DOMAIN: localhost
      BW_DOMAIN: bw.localhost
      CHARITY_DOMAIN: charity.localhost
      ADMIN_WEB_DOMAIN: admin.localhost
      ADMIN_CHARITY_DOMAIN: admin-charity.localhost
      API_DOMAIN: api.localhost

  # ── 前台／後台：改用本機網域，並額外開放對外埠方便單獨測試（不必每次都經過 proxy） ──
  nuxt-tcrfc:
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NUXT_PUBLIC_SITE_URL: http://localhost:8080
      NUXT_PUBLIC_API_BASE: http://api.localhost:8080
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}

  nuxt-bw:
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      NUXT_PUBLIC_SITE_URL: http://bw.localhost:8080
      NUXT_PUBLIC_API_BASE: http://api.localhost:8080
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}

  nuxt-charity:
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      NUXT_PUBLIC_SITE_URL: http://charity.localhost:8080
      NUXT_PUBLIC_API_BASE: http://api.localhost:8080

  admin-web:
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      VITE_API_BASE: http://api.localhost:8080

  admin-charity:
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      VITE_API_BASE: http://api.localhost:8080

  # ── API：指到本機的兩個祕密檔（deploy/dev/*.env，不進版控）與宿主機的 sqlserver 容器 ──
  api:
    depends_on:
      redis: { condition: service_healthy }
      # 🔴 不再有 mssql-dev 這個 compose 服務可以 depends_on——資料庫現在是宿主機上一個
      # 獨立於本 compose 專案的既有容器（`sqlserver`），compose 管不到它的健康狀態。
      # `api` 的 /readyz 本身會探測資料庫連線（docs/20-cicd.md §6），啟動順序交給它的
      # healthcheck／retry 邏輯，不再靠 depends_on 的 condition 卡順序。
    # extra_hosts：讓容器連得到宿主機。Docker Desktop（macOS／Windows）預設就會提供
    # host.docker.internal，這行主要是為了 Linux 相容（Docker 20.10+ 用 host-gateway 這個
    # 特殊值達成同樣效果）——兩種平台都適用，多寫不會壞。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # !override：list 型欄位預設串接。這裡即使不加也不會真的壞（正式版那兩個 /opt 路徑
    # 在本機不存在、required: false 會被跳過），但明確蓋掉比較不會誤導——api 在本機開發時
    # 就是只吃這兩個檔案，不該讓人以為它同時也在讀 /opt 底下的東西。
    env_file: !override
      - path: ./deploy/dev/club.env
        required: true
      - path: ./deploy/dev/charity.env
        required: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}

  redis:
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD:-dev-redis-password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
    # 本機開發沿用正式版「不對外開連接埠」的紀律（docs/17 §1 三條不能弄錯的之一）——
    # 要查資料改用 `docker compose exec redis redis-cli`，不靠發布連接埠。
