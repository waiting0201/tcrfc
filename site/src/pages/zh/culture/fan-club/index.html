<!-- SPEC 3.8 §8.2 — Join the Fan Club 入會表單 -->
<section class="band" id="join" aria-labelledby="join-title">
  <div class="container">
    <div class="eyebrow-row">
      <div>
        <p class="kicker">JOIN THE FAN CLUB</p>
        <h2 class="section-title" id="join-title">加入球迷會</h2>
      </div>
    </div>

    <form class="form-grid" onsubmit="return false;" style="margin-top:1.75rem">
      <div class="form-field">
        <label for="fc-name">姓名</label>
        <input type="text" id="fc-name" name="name" autocomplete="name" required>
      </div>
      <div class="form-field">
        <label for="fc-email">Email</label>
        <input type="email" id="fc-email" name="email" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="fc-phone">聯絡電話</label>
        <input type="tel" id="fc-phone" name="phone" autocomplete="tel" required>
      </div>
      <div class="form-field">
        <label for="fc-plan">方案選擇</label>
        <select id="fc-plan" name="plan" required>
          <option value="" selected>方案內容準備中，請先留下聯絡資料</option>
        </select>
      </div>
      <div class="form-field form-field--full">
        <button class="btn btn--primary" type="submit">送出入會申請</button>
      </div>
    </form>
  </div>
</section>

<!-- SPEC 3.8 §8.2 — Fan Benefits 福利分級對照表 -->
<section class="band grain" id="benefits" aria-labelledby="benefits-title">
  <div class="band-inner container">
    <div class="eyebrow-row">
      <div>
        <p class="kicker kicker--on-dark">FAN BENEFITS</p>
        <h2 class="section-title" id="benefits-title" style="color:#fff">會員福利</h2>
      </div>
    </div>

    <div class="table-scroll">
      <table class="benefit-table">
        <thead>
          <tr>
            <th scope="col">福利項目</th>
            <th scope="col">方案一</th>
            <th scope="col">方案二</th>
            <th scope="col">方案三</th>
          </tr>
        </thead>
        <tbody>
          <tr><th scope="row">—</th><td colspan="3">福利分級對照表準備中，稍後將於本頁公布。</td></tr>
        </tbody>
      </table>
    </div>
    
  </div>
</section>

      <figure class="event-photo">
        <img src="{{ROOT}}/assets/img/fanclub/fanclub-event-04.jpg" alt="球員、學員與球迷於球場大合照" loading="lazy" width="1600" height="1067">
