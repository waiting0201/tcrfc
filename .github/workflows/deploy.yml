# .github/workflows/deploy.yml — push master：build ＋ push ghcr（hosted runner）
#                                                  ↓
#                          部署到正式 VM（self-hosted runner，在 VM 本機，CD 段 2026-10-02 起啟用）
#
# 對應 docs/20-cicd.md §1「觸發與分支」、§4「部署」、§4a「CD 實作」、§6「失敗與回滾」。
# 部署 job 在 VM 的 checkout 目錄執行 deploy/cd-deploy.sh：拉映像檔 → docker compose up -d --wait →
# 健康檢查 → 失敗自動退回上一個成功版本 → 成功才更新 /opt/tcrfc/deploy-state.env → 清 Cloudflare 快取（選配）。
# 🔴 不執行任何資料庫 migration（docs/20 §5，走 db-migrate.yml 的人工核准關卡）。
#
# 🔴 防護鏈（docs/20 §4）：self-hosted 這個 label 只出現在 deploy job，而本檔只被 push master 與
# workflow_dispatch 觸發，沒有 pull_request／pull_request_target；job 另有 ref 與 repo 判斷，
# 並參照 environment: production（Deployment branches 僅 master）。第 0 條（repo 設定「Fork pull request
# workflows 需核准」）是地基，在 GitHub 設定而不在本檔。
#
# ⚠️ 不重跑 ci.yml 的 lint／dotnet test：docs/20-cicd.md §1 的分工是「ci.yml 驗 PR、
# deploy.yml 只管 push master 之後的建置與部署」，假設 master 已經在 PR 階段驗過。
# 如果 master 允許直接 push（目前沒開分支保護，docs/20 §1「Fork PR 隔離」分支保護一列
# 是「建議但不列為硬性關卡」），這裡就沒有再跑一次 lint／test 的安全網——這是本檔跟隨
# docs/20 既有設計的取捨，不是本次任務另外做的決定，如需加固請回頭改 docs/20 §1 再同步這裡。

name: Deploy

on:
  push:
    branches: [master]
  # 手動觸發＝五個映像檔全部重建（首次部署、映像檔遺失或要強制重建時用）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false # 部署不能被半途取消，讓它跑完（成功或自動回滾都好過跑到一半被砍）

jobs:
  changes:
    name: 偵測變動範圍
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web }}
      web_charity: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web_charity }}
      admin: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.admin }}
      admin_charity: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.admin_charity }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api }}
      deploy_config: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.deploy_config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.node-version'
            web_charity:
              - 'apps/web-charity/**'
              - 'db/seed/emit-charity-fixtures.py'
              - 'db/seed/charity-fixtures.json'
              - '.node-version'
            admin:
              - 'apps/admin/**'
              - '.node-version'
            admin_charity:
              - 'apps/admin-charity/**'
              - 'db/seed/emit-charity-fixtures.py'
              - 'db/seed/charity-fixtures.json'
              - '.node-version'
            api:
              - 'apps/api/**'
            # deploy/** 本身不建映像檔，但改了 compose／Caddy 設定，部署 job（待補）要重新
            # `docker compose pull && up -d` 讓新設定生效（docs/20-cicd.md §3「Job 切法」）。
            deploy_config:
              - 'deploy/**'
              - 'docker-compose.yml'

  # ── build ＋ push：四個 Node 應用 ──────────────────────────────────────────
  # 🔴 刻意不用 strategy.matrix：job 層級的 `if:` 條件式**不保證能讀到 matrix context**
  # （GitHub 官方文件對 `jobs.<job_id>.if` 可用的 context 清單裡沒有 matrix，跟 steps 層級的
  # `if:` 不同），寫成 `matrix.app_dir == 'apps/web'` 這種條件式風險是「看起來合理，實際上
  # 條件永遠算不出預期結果」——這類錯誤 actionlint 不一定抓得到（語法合法，只是語意上下文
  # 不保證有值）。改成四個各自獨立的 job，每個都用 `needs.changes.outputs.X` 判斷，
  # 條件式本身在所有已知 GitHub Actions 版本都保證可用，不需要賭 matrix 在 job if 是否可讀。
  build-node-web:
    name: 建置並推送映像檔（tcrfc-nuxt-club）
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # 被呼叫的 workflow 要 packages: write；呼叫端 job 必須授予同等權限，否則整支 workflow startup_failure
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_node-app-deploy.yml
    with:
      app_dir: apps/web
      image_name: tcrfc-nuxt-club
    secrets: inherit

  build-node-web-charity:
    name: 建置並推送映像檔（tcrfc-nuxt-charity）
    needs: changes
    if: needs.changes.outputs.web_charity == 'true'
    # 被呼叫的 workflow 要 packages: write；呼叫端 job 必須授予同等權限，否則整支 workflow startup_failure
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_node-app-deploy.yml
    with:
      app_dir: apps/web-charity
      image_name: tcrfc-nuxt-charity
    secrets: inherit

  build-node-admin:
    name: 建置並推送映像檔（tcrfc-admin-web）
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    # 被呼叫的 workflow 要 packages: write；呼叫端 job 必須授予同等權限，否則整支 workflow startup_failure
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_node-app-deploy.yml
    with:
      app_dir: apps/admin
      image_name: tcrfc-admin-web
    secrets: inherit

  build-node-admin-charity:
    name: 建置並推送映像檔（tcrfc-admin-charity）
    needs: changes
    if: needs.changes.outputs.admin_charity == 'true'
    # 被呼叫的 workflow 要 packages: write；呼叫端 job 必須授予同等權限，否則整支 workflow startup_failure
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_node-app-deploy.yml
    with:
      app_dir: apps/admin-charity
      image_name: tcrfc-admin-charity
    secrets: inherit

  # ── build ＋ push：api（.NET）─────────────────────────────────────────────
  # 🔴 這裡刻意不重跑 dotnet test（ci.yml 的 api job 已經跑過，見該檔說明「不重跑」的理由）。
  build-api:
    name: 建置並推送映像檔（tcrfc-api）
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: docker build ＋ push
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tcrfc-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tcrfc-api:master
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ════════════════════════════════════════════════════════════════════════
  # CD 段：部署到正式 VM（docs/20-cicd.md §4a）
  # ════════════════════════════════════════════════════════════════════════
  deploy:
    name: 部署到正式 VM
    needs:
      - changes
      - build-node-web
      - build-node-web-charity
      - build-node-admin
      - build-node-admin-charity
      - build-api
    # build job 被 skip（沒變動）時 needs 的結果是 skipped，預設會連帶 skip 本 job，所以要用 !cancelled()
    # 讓條件式自己判斷；任何一個 build 失敗或被取消則不部署（舊版繼續跑，不會半新半舊）。
    # 只在「有映像檔重建」或「deploy／compose 設定有變」時部署（changes 的輸出已含 workflow_dispatch＝全部 true）。
    if: >-
      ${{ !cancelled()
      && github.repository == 'waiting0201/tcrfc'
      && github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.changes.outputs.web == 'true'
      || needs.changes.outputs.web_charity == 'true'
      || needs.changes.outputs.admin == 'true'
      || needs.changes.outputs.admin_charity == 'true'
      || needs.changes.outputs.api == 'true'
      || needs.changes.outputs.deploy_config == 'true') }}
    runs-on: [self-hosted, tcrfc-vm]
    environment: production
    permissions:
      contents: read
    # 與 rollback.yml 共用同一個群組：部署與回滾不會同時動 VM；不可取消（半途被砍比失敗更糟）。
    concurrency:
      group: cd-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      # checkout 目錄（runner 的 work 目錄，固定路徑）就是 compose 的專案目錄：docker-compose.yml、
      # deploy/Caddyfile* 都用這一份，永遠等於本次提交（docs/20 §4a「為什麼用 checkout 目錄」）。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 部署（docker compose up -d --wait ＋ 健康檢查 ＋ 失敗自動回滾）
        id: cd
        env:
          CD_MODE: deploy
          CD_SHA: ${{ github.sha }}
          # 有重建的映像檔鍵；沒重建的沿用 deploy-state.env 記錄的上一版標籤
          CD_REBUILT: >-
            ${{ needs.build-node-web.result == 'success' && 'nuxt_club' || '' }}
            ${{ needs.build-node-web-charity.result == 'success' && 'nuxt_charity' || '' }}
            ${{ needs.build-node-admin.result == 'success' && 'admin_web' || '' }}
            ${{ needs.build-node-admin-charity.result == 'success' && 'admin_charity' || '' }}
            ${{ needs.build-api.result == 'success' && 'api' || '' }}
        run: /bin/bash deploy/cd-deploy.sh

      # 清快取是選配：沒設 secret 只在 summary 註明；呼叫失敗也不讓部署失敗（腳本一律 exit 0）。
      - name: 清 Cloudflare 快取（選配）
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID_TCRFC: ${{ vars.CF_ZONE_ID_TCRFC }}
          CF_ZONE_ID_BW: ${{ vars.CF_ZONE_ID_BW }}
          CF_ZONE_ID_CHARITY: ${{ vars.CF_ZONE_ID_CHARITY }}
          CHANGED_IMAGES: ${{ steps.cd.outputs.changed_images }}
        run: /bin/bash deploy/cd-purge-cache.sh

      # 失敗通知管道（Email／LINE／Slack）尚未由使用者選定（docs/20 §8）；選定後在此加 on-failure 步驟。
