# .github/workflows/ci.yml — PR 檢查：lint／build／unit test／docker build（不 push、不部署）
#
# 對應 docs/20-cicd.md §1「觸發與分支」：pull_request → ci.yml，一律跑在 GitHub-hosted runner
# （不用 self-hosted，見 docs/20 §1「Fork PR 隔離」——self-hosted 這個 label 只出現在
# deploy.yml，本檔完全不觸碰）。CD（push master 之後的建置、推送 ghcr、部署）在 deploy.yml，
# 本檔只到「docker build 能成功」為止，push: false。
#
# 🔴 這是本專案第一份 workflow 檔（S0-7c）。CD 段（部署到正式 VM）刻意不在本檔，也還沒有獨立的
# deploy.yml 之外的 db-migrate.yml／rollback.yml——self-hosted runner 要裝在正式 VM 上，VM 隨
# STATUS.md S0-6（Azure 資源開通）暫緩，見 docs/20-cicd.md「實作進度」一節。

name: CI

on:
  pull_request:
    branches: [master]

# 🔴 公開 repo 的地基防護（docs/20-cicd.md §1「Fork PR 隔離」）：頂層只給 contents: read，
# 不給 packages: write、不給任何部署相關權限。即使某個 job 寫錯，fork PR 觸發的這個 workflow
# 也沒有權限推送映像檔或動到任何 Environment。
permissions:
  contents: read

# 同一個 PR 有新的 commit 進來，取消還在跑的舊一輪——省 GitHub-hosted runner 的分鐘數
# （雖然公開 repo 本身不計費，但排隊時間仍然是排隊時間）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── 偵測這次 PR 動到哪些應用，決定要跑哪些下游 job ─────────────────────────
  # 對應 docs/20-cicd.md §3「Job 切法」：五個應用目錄一對一映射五個映像檔，全部平行、無相依。
  changes:
    name: 偵測變動範圍
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      web_charity: ${{ steps.filter.outputs.web_charity }}
      admin: ${{ steps.filter.outputs.admin }}
      admin_charity: ${{ steps.filter.outputs.admin_charity }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.node-version'
            web_charity:
              - 'apps/web-charity/**'
              - 'db/seed/emit-charity-fixtures.py'
              - 'db/seed/charity-fixtures.json'
              - '.node-version'
            admin:
              - 'apps/admin/**'
              - '.node-version'
            admin_charity:
              - 'apps/admin-charity/**'
              - 'db/seed/emit-charity-fixtures.py'
              - 'db/seed/charity-fixtures.json'
              - '.node-version'
            api:
              - 'apps/api/**'

  # ── 四個 Node 應用：lint（含 S0-9h 的 Node 版本防漂移檢查）＋ docker build（不 push） ──
  web:
    name: apps/web（lint／docker build）
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/_node-app.yml
    with:
      app_dir: apps/web
      image_name: tcrfc-nuxt-club

  web-charity:
    name: apps/web-charity（lint／docker build）
    needs: changes
    if: needs.changes.outputs.web_charity == 'true'
    uses: ./.github/workflows/_node-app.yml
    with:
      app_dir: apps/web-charity
      image_name: tcrfc-nuxt-charity

  admin:
    name: apps/admin（lint／docker build）
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/_node-app.yml
    with:
      app_dir: apps/admin
      image_name: tcrfc-admin-web

  admin-charity:
    name: apps/admin-charity（lint／docker build）
    needs: changes
    if: needs.changes.outputs.admin_charity == 'true'
    uses: ./.github/workflows/_node-app.yml
    with:
      app_dir: apps/admin-charity
      image_name: tcrfc-admin-charity

  # ── apps/api（.NET）：真的接一個用完即丟的 SQL Server 容器跑 dotnet test，不 mock ──────
  # 對應 docs/20-cicd.md §1「不建 staging 分支／環境」：用 CI runner 本身當一次性 staging，
  # 「api ＋ 一個用完即丟的 SQL Server 容器」。這裡用 GitHub Actions 原生的 `services:`
  # （比另外寫一份 docker-compose.ci.yml 更簡單，效果相同：job 結束容器就銷毀，零殘留）。
  #
  # apps/api/README.md「測試」一節明文留了一句話給接 CI 的人決定：「若之後接上 CI 且 CI
  # 固定會提供資料庫，這個決定可以重新評估」——這裡的決定是：**接，讓測試打真正的資料庫**，
  # 不引入 Xunit.SkippableFact 之類的「沒資料庫就略過」語意（那樣會讓 CI 看起來綠但其實
  # 什麼都沒驗到，違背 docs/18-work-errors.md E-34 的教訓：長期看起來過的檢查最危險）。
  api:
    name: apps/api（build／test／docker build）
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # ⚠️ 這組密碼只活在這個 job 專屬、跑完即銷毀的 SQL Server 容器裡，不是任何環境的真實憑證，
      # 不是需要保密的 secret（docs/20-cicd.md §7 的精神：能在「用完即丟的地方」解決的機密，
      # 不需要進 GitHub Secrets）。複雜度只是為了滿足 SQL Server 對 SA 密碼的强度要求。
      CI_MSSQL_SA_PASSWORD: 'Ci_Throwaway_Str0ng!24'
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Ci_Throwaway_Str0ng!24'
        ports:
          - 1433:1433
        # --name 讓這個服務容器有一個可預期的 docker container 名稱，好讓下面的步驟直接沿用
        # deploy/local-ddl.sh／db/seed/apply-*.sh 既有的 `docker exec <容器名稱>` 設計
        # （這兩支腳本本來就靠 LOCAL_MSSQL_CONTAINER 環境變數指定容器名稱，本機開發時指的是
        # 既有的 `sqlserver` 容器，CI 這裡指的是這個用完即丟的服務容器，同一支腳本，換個目標）。
        options: >-
          --name mssql-ci

    steps:
      - uses: actions/checkout@v4

      - name: 等待 SQL Server 就緒
        run: |
          for i in $(seq 1 30); do
            if docker exec mssql-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${CI_MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server 就緒（等待 ${i} 次，每次 2 秒）"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server 逾時未就緒" >&2
          exit 1

      # 🔴 S0-13（2026-09-25）：dotnet test 改連專用的 tcrfc_club_test，不再用 tcrfc_club_dev
      # ——本機開發與 CI 現在對齊同一套「整合測試不碰開發／實走用資料庫」的原則，見
      # docs/14-invariants.md、apps/api/README.md「怎麼跑」。這一步仍先跑 --apply 建立
      # tcrfc_charity_dev（下面「灌種子資料（慈善庫）」要用），tcrfc_club_dev 在 CI 這個
      # 用完即丟的容器裡本身就沒有任何步驟會用到，留著沒有風險（容器隨 job 結束銷毀）。
      - name: 灌 DDL（deploy/local-ddl.sh --apply，與本機開發同一支腳本、同一份轉換規則；本步驟只用來建立慈善庫 tcrfc_charity_dev）
        env:
          LOCAL_MSSQL_CONTAINER: mssql-ci
          MSSQL_DEV_SA_PASSWORD: ${{ env.CI_MSSQL_SA_PASSWORD }}
        run: ./deploy/local-ddl.sh --apply

      - name: 建立並灌入整合測試專用庫（tcrfc_club_test，S0-13，與本機開發同一支腳本 db/seed/setup-test-db.sh）
        env:
          LOCAL_MSSQL_CONTAINER: mssql-ci
          MSSQL_DEV_SA_PASSWORD: ${{ env.CI_MSSQL_SA_PASSWORD }}
        run: ./db/seed/setup-test-db.sh --recreate

      - name: 灌種子資料（慈善庫 tcrfc_charity_dev）
        env:
          LOCAL_MSSQL_CONTAINER: mssql-ci
          MSSQL_DEV_SA_PASSWORD: ${{ env.CI_MSSQL_SA_PASSWORD }}
        run: ./db/seed/apply-charity-seed.sh

      - name: 確保 redis-server 執行檔存在（兩個測試 fixture 會真的啟動 redis-server 子行程，不 mock）
        run: command -v redis-server || (sudo apt-get update -y && sudo apt-get install -y redis-server)

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 還原 NuGet 套件快取
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api/packages.lock.json', 'apps/api/Tcrfc.Api.Tests/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: dotnet restore（--locked-mode，比照 Dockerfile 一致，鎖檔漂移直接失敗）
        run: |
          dotnet restore apps/api/Tcrfc.Api.csproj --locked-mode
          dotnet restore apps/api/Tcrfc.Api.Tests/Tcrfc.Api.Tests.csproj --locked-mode

      - name: dotnet build（主專案，Release）
        run: dotnet build apps/api/Tcrfc.Api.csproj -c Release --no-restore

      # ── EF Core migrations 基準健檢（S0-7j，docs/18-work-errors.md E-45）──────────────
      # E-45 的根因：InitialBaseline 只 commit 了 .cs／.Designer.cs，ClubDbContextModelSnapshot.cs
      # 從沒進版控，之後兩次改綱要（AdminRefreshToken／matches.original_*）都沒有補 migration，
      # 因為缺 snapshot 這件事本身不會讓任何測試變紅。這裡補兩道檢查，任一失敗就擋 PR：
      #   ① 有 Migrations/*.Designer.cs 卻沒有 ClubDbContextModelSnapshot.cs——代表 snapshot
      #      被刪掉或忘記 commit，下一次 `dotnet ef migrations add` 會拿空模型當基準。
      #   ② `dotnet ef migrations has-pending-model-changes`——目前程式碼裡的 Entity／
      #      OnModelCreatingPartial 與最後一個 migration＋snapshot 描述的模型有沒有落差；
      #      有落差代表某次改了 Entity 卻忘記補 migration（就是 e67ef26／S0-9l 那兩次的錯誤形狀）。
      # 這道指令**不需要真的連得上資料庫**（只比對記憶體中的模型物件，不開連線），
      # 但建置 DbContext 仍需要 CLUB_SQL_CONNECTION_STRING 這個設定鍵存在（否則 Program.cs
      # 會在還沒到比對邏輯前就丟 InvalidOperationException），所以沿用同一個測試用連線字串。
      # 驗收方式見 apps/api/README.md「EF Core migrations 基準健檢」：分別用「刪掉 snapshot」
      # 「改模型不加 migration」兩種真實錯誤形狀跑過一次，兩種都讓這一步變紅，復原後變綠。
      - name: EF Core migrations 基準健檢（snapshot 存在性 ＋ 模型與 snapshot 是否一致）
        env:
          CLUB_SQL_CONNECTION_STRING: "Server=127.0.0.1,1433;Database=tcrfc_club_test;User Id=sa;Password=${{ env.CI_MSSQL_SA_PASSWORD }};TrustServerCertificate=True;"
        run: |
          set -euo pipefail
          cd apps/api
          if compgen -G "Data/Migrations/*.Designer.cs" > /dev/null; then
            if [ ! -f "Data/Migrations/ClubDbContextModelSnapshot.cs" ]; then
              echo "::error::存在 Migrations/*.Designer.cs 但找不到 Data/Migrations/ClubDbContextModelSnapshot.cs。" \
                   "少了 snapshot，下一次 dotnet ef migrations add 會拿空模型當基準，見 docs/18-work-errors.md E-45。"
              exit 1
            fi
          fi
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --context ClubDbContext

      - name: dotnet test（Tcrfc.Api.Tests，接真正的 SQL Server 與 redis-server）
        env:
          CLUB_SQL_CONNECTION_STRING: "Server=127.0.0.1,1433;Database=tcrfc_club_test;User Id=sa;Password=${{ env.CI_MSSQL_SA_PASSWORD }};TrustServerCertificate=True;"
        run: dotnet test apps/api/Tcrfc.Api.Tests/Tcrfc.Api.Tests.csproj -c Release --no-restore

      - uses: docker/setup-buildx-action@v3

      - name: docker build（apps/api，不 push——只驗證 Dockerfile 能建成，docs/18 E-35 的教訓）
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/tcrfc-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ── OpenAPI 漂移檢查：待補 ──────────────────────────────────────────────────
  # docs/20-cicd.md §1 提到「若後台前端有型別產生器」才需要這一步——apps/admin／
  # apps/admin-charity 目前是手寫 TypeScript 型別，沒有從 apps/api 的 OpenAPI schema
  # 產生前端型別的工具鏈，這一步暫時沒有東西可檢查。等後台改用型別產生器時，在這裡加一個
  # job：重新產生型別、`git diff --exit-code` 比對是否與已提交的型別檔一致。
