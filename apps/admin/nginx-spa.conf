# apps/admin/nginx-spa.conf — Vue 3 SPA 的 nginx 服務設定
# 給 nginxinc/nginx-unprivileged 用，監聽 8080（該映像檔的預設非特權連接埠）。
#
# ⚠️ nginx 的 add_header 繼承規則：子層級（location）只要自己宣告了任何一個 add_header，
# 就完全不會繼承上層（server）宣告的 add_header，不是「疊加」而是「整組蓋掉」。
# 原本把 X-Robots-Tag 只放在 server 層級，但每個 location 都各自有自己的 add_header
# （Cache-Control 等），實測（S0-12 docker run + curl -I）發現 X-Robots-Tag 完全沒有送出，
# 等於「不讓搜尋引擎收錄」這條全域規定（CLAUDE.md 第 5 條）沒有真的生效。
# 修法：每個會回應實際內容的 location 都自己重複宣告一次 X-Robots-Tag。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 健康檢查探針，proxy／compose healthcheck 打這個路徑（純文字，沒有被搜尋引擎索引的疑慮，不必加）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 靜態資產長快取（Vite 產物檔名帶 hash，可安全長快取）
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # SPA fallback：找不到實體檔案一律回 index.html，交給前端路由處理
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
