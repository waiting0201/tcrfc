# apps/admin/nginx-spa.conf — Vue 3 SPA 的 nginx 服務設定
# 給 nginxinc/nginx-unprivileged 用，監聽 8080（該映像檔的預設非特權連接埠）。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 健康檢查探針，proxy／compose healthcheck 打這個路徑
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 靜態資產長快取（Vite 產物檔名帶 hash，可安全長快取）
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback：找不到實體檔案一律回 index.html，交給前端路由處理
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 後台一律 noindex（CLAUDE.md 全域規定第 5 條）
    add_header X-Robots-Tag "noindex, nofollow" always;
}
