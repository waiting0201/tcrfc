<!DOCTYPE html>
<!-- 深色是唯一主題（docs/21-admin-ui.md §7.0），固定在標記層就掛 class，main.ts 裡的
     classList.add('dark') 是保險（idempotent），這裡先掛是避免任何延遲載入造成的白底閃爍 -->
<html lang="zh-Hant" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 後台不需要 SEO，但仍要擋掉搜尋引擎（CLAUDE.md 全域規定第 5 條，nginx 端也有一份 X-Robots-Tag） -->
    <meta name="robots" content="noindex, nofollow" />
    <title>TCRFC 後台管理</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
