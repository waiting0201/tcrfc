# apps/admin-charity/nginx-spa.conf — Vue 3 SPA 的 nginx 服務設定
# 給 nginxinc/nginx-unprivileged 用，監聽 8080（該映像檔的預設非特權連接埠）。
#
# ⚠️ nginx 的 add_header 繼承規則：子層級（location）只要自己宣告了任何一個 add_header，
# 就完全不會繼承上層（server）宣告的 add_header，不是「疊加」而是「整組蓋掉」。本檔原本把
# X-Robots-Tag 放在 server 區塊最外層（兩個 location 之後），但兩個 location 各自都有自己的
# add_header（Cache-Control），依上述規則，server 層級那個 X-Robots-Tag 對它們完全不會生效
# ——這正是 apps/admin 踩過的 E-29（docs/18-work-errors.md），本檔審查時發現同一個錯誤又在
# 這裡出現一次，已在 apps/admin-charity 建立時一併修正：每個會回應實際內容的 location 都
# 自己重複宣告一次 X-Robots-Tag，不依賴 server 層級繼承。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
